[project]
name = "dra"
version = "0.14.2"
description = "Deep Research Advanced"
authors = ["Kenny Dizi <chitrung09t2@gmail.com>"]
requires-python = ">=3.9,<3.13"
dependencies = [
    "openai==1.97.1",
    "anthropic==0.60.0",
    "tiktoken==0.9.0",
    "gpt-researcher==0.14.2",
    "unstructured-client==0.41.0",
    "unstructured==0.18.11",
    "unstructured-inference==1.0.5",
    "langchain-unstructured==0.1.6",
    "langchain-core==0.3.72",
    "langchain==0.3.27",
    "langchain-community==0.3.27",
    "langchain-deepseek==0.1.4",
    "langchain-openai==0.3.28",
    "langchain-anthropic==0.3.18",
    "tavily-python==0.7.10",
    "firecrawl-py==2.16.3",
    "networkx==3.5",
    "langchain-text-splitters==0.3.9",
    "python-dotenv==1.1.1",
    "faiss-cpu==1.11.0",
    "markdown-it-py==3.0.0",
    "numpy==2.3.2",
    "ruff==0.12.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py39"